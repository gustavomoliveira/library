name: CI - config-server

on:
  push:
    branches: [main, develop]
    paths:
      - 'config-server/**'
  pull_request:
    paths:
      - 'config-server/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: config-server/pom.xml

      - name: Rodar testes e build Maven
        working-directory: config-server
        run: ./mvnw clean package

      - name: Confirmar que o Dockerfile builda
        run: docker build -t config-server:ci ./config-server