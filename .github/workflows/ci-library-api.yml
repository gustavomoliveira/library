name: CI - library-api

on:
  push:
    branches: [main, develop]
    paths:
      - 'library-api/**'
  pull_request:
    paths:
      - 'library-api/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: library-api/pom.xml

      - name: Rodar testes e build Maven
        working-directory: library-api
        run: ./mvnw clean package

      - name: Confirmar que o Dockerfile builda
        run: docker build -t library-api:ci ./library-api